<!doctype html>
<html lang="en"><head>
<meta name="atlas-mode" content="static"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thor’s Kobe Spatial Atlas</title><meta name="description" content="An editable atlas of Kobe's landscapes, history and infrastructure."><link rel="icon" type="image/svg+xml" href="assets/kobe-mark.svg"><link rel="stylesheet" href="vendor/leaflet/leaflet.css"><link rel="stylesheet" href="vendor/draw/leaflet.draw.css"><link rel="stylesheet" href="styles.css?v=20261009o"><link rel="stylesheet" href="glass.css?v=20261009o"><link rel="stylesheet" href="timeline.css?v=20261009o"><link rel="stylesheet" href="contrast.css?v=20261009o">
<link rel="stylesheet" href="events.css?v=20261009o"><link rel="stylesheet" href="awaji.css?v=20261009o"></head>
<body>
<main id="atlas" aria-label="Thor’s Kobe Spatial Atlas">
  <div id="map" aria-label="Interactive map of Kobe"></div>
  <nav id="sidebar" aria-label="Atlas pages"><button id="menu-toggle" class="brand-button" aria-label="Expand navigation" aria-expanded="false"><span class="brand-mark"><img src="assets/kobe-mark.svg" alt="" width="40" height="40"></span><span class="nav-text">Thor’s Kobe Atlas</span></button><div id="page-nav"></div><div class="nav-bottom"><button id="sources-button" class="nav-item" title="Sources" aria-label="Sources"></button><button id="edit-button" class="nav-item" title="Edit atlas" aria-label="Edit atlas"></button><div id="language-switcher"><button id="language-current" aria-label="Language: EN">EN</button><div id="language-options" role="group" aria-label="Language"><button data-language="JP" lang="ja" aria-label="Japanese" aria-pressed="false">JP</button><button data-language="CN" lang="zh-CN" aria-label="Chinese" aria-pressed="false">CN</button><button data-language="EN" lang="en" aria-label="English" aria-pressed="true">EN</button></div></div></div></nav>
  <header class="map-heading"><div class="eyebrow" id="edition-label">WORKING EDITION</div><h1 id="atlas-title">Thor’s Kobe<span>Spatial Atlas</span></h1><div id="view-label">Timeline</div><div class="atlas-credit"><span data-i18n="creator">Created by</span> <span id="creator-name" data-no-translate>赵常许 Thor (T Matsui)</span></div></header>
  <section id="layer-panel" class="panel layer-panel" aria-label="Map layers"><div class="panel-heading"><div><span class="eyebrow" data-i18n="viewOptions">VIEW OPTIONS</span><h2 data-i18n="layers">Layers</h2></div><button id="layers-collapse" class="icon-button" aria-label="Collapse layers" aria-expanded="true"></button></div><div id="layer-body"><div class="layer-actions"><label class="check-label"><input id="all-layers" type="checkbox"><span data-i18n="allLayers">All layers</span></label><button id="follow-chapter" class="text-button">Follow chapter</button></div><div id="layer-list" class="layer-list"></div><div class="layer-footer"><label class="check-label"><input type="checkbox" id="offline-toggle"><span data-i18n="offline">Downloaded maps only</span></label><div id="layer-status" class="small muted">Source detail loads as needed.</div></div></div></section>
  <section id="info-panel" class="panel info-panel" aria-label="Current chapter information"><button id="info-close" class="icon-button info-close" aria-label="Close chapter information"></button><div class="info-scroll"><div class="eyebrow" id="info-date"></div><h2 id="info-heading"></h2><div id="info-body" class="prose"></div><p id="info-source" class="source-note"></p></div></section>
  <section id="subject-panel" class="panel subject-panel" hidden><div class="eyebrow" data-i18n="subject">EXPLORE A SUBJECT</div><h2 id="subject-title"></h2><div id="subject-body" class="prose"></div></section>
  <div id="map-tools" class="panel map-tools"><button id="zoom-in" class="icon-button" aria-label="Zoom in"></button><button id="zoom-out" class="icon-button" aria-label="Zoom out"></button><button id="reset-view" class="icon-button" aria-label="Return to Kobe overview" title="Return to Kobe overview"></button></div>
  <section id="timeline-panel" class="timeline-panel" aria-label="Historical timeline"><div class="playback-controls"><button id="back-play" class="control-button" aria-label="Play backward" title="Play backward"></button><button id="play-pause" class="control-button primary" aria-label="Play" title="Play or pause"></button><button id="forward-play" class="control-button" aria-label="Play forward" title="Play forward"></button><button id="info-toggle" class="control-button active" aria-label="Chapter information" aria-pressed="true" title="Chapter information"></button></div><div class="panel timeline-main"><div id="chapter-track" class="chapter-track" role="group" aria-label="Choose a chapter"></div><input id="chapter-progress" class="chapter-progress" type="range" min="0" max="1000" value="0" aria-label="Position within current chapter"></div></section>
  <div id="draw-banner" class="panel draw-banner" hidden><span id="draw-instruction"></span><button id="draw-finish" class="button">Use shape</button><button id="draw-cancel" class="button secondary">Cancel</button></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="startup-error" class="panel startup-error" hidden></div>
</main>
<dialog id="editor-dialog" aria-labelledby="editor-title"></dialog>
<dialog id="sources-dialog" aria-labelledby="sources-title"></dialog>
<script src="vendor/leaflet/leaflet.js"></script><script src="vendor/draw/leaflet.draw.js"></script><script type="module" src="js/app.js?v=20261009o"></script>
</body></html>
